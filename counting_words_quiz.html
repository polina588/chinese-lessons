<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量词练习</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:20px}
.container{max-width:900px;margin:auto}
.card{background:white;border-radius:20px;padding:30px;box-shadow:0 4px 15px rgba(0,0,0,.08);text-align:center}
.progress{height:14px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;width:0;background:#4caf50}
.question{font-size:48px;font-weight:bold;margin:25px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.option{padding:18px;font-size:30px;border:none;border-radius:12px;cursor:pointer;background:#eef2ff}
.option.selected{background:#cfd8ff}
.feedback{margin-top:20px;font-size:21px;line-height:1.6}
.next,.check{margin-top:20px;padding:10px 20px;font-size:18px;cursor:pointer}
.next{display:none}
.note{color:#666;margin-bottom:10px}
@media(max-width:768px){
.question{font-size:34px}
.option{font-size:24px}
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>量词练习</h1>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="counter"></div>
<div id="note" class="note"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="check" id="checkBtn">Проверить</button>
<button class="next" id="nextBtn">下一题</button>
</div>
</div>

<script>
const questions=[
{type:"single",q:"三___书",a:"本",o:["本","个","支","瓶"],e:"✅ 三本书<br><b>sān běn shū</b><br>Три книги.<br><br><b>本</b> — счётное слово для предметов с переплётом."},
{type:"single",q:"两___词典",a:"本",o:["本","个","杯","瓶"],e:"✅ 两本词典<br><b>liǎng běn cídiǎn</b><br>Два словаря.<br><br><b>本</b> — для книг и словарей."},
{type:"single",q:"五___本子",a:["本","个"],o:["本","个","支","碗"],e:"✅ 五本本子<br><b>wǔ běn běnzi</b><br>Пять тетрадей.<br><br><b>本</b> — специальное счётное слово для предметов с переплётом.<br><br>💡 Также можно сказать <b>五个本子</b>. В разговорной речи 个 встречается чаще."},
{type:"single",q:"四___面包",a:"个",o:["个","本","支","杯"],e:"✅ 四个面包<br><b>sì gè miànbāo</b><br>Четыре хлеба.<br><br><b>个</b> — универсальное счётное слово."},
{type:"single",q:"六___书包",a:"个",o:["个","本","瓶","碗"],e:"✅ 六个书包<br><b>liù gè shūbāo</b><br>Шесть рюкзаков.<br><br><b>个</b> — самое распространённое универсальное счётное слово."},
{type:"single",q:"七___笔",a:"支",o:["支","个","本","瓶"],e:"✅ 七支笔<br><b>qī zhī bǐ</b><br>Семь ручек.<br><br><b>支</b> — счётное слово для длинных вытянутых предметов: ручек, карандашей и т.д."},
{type:"single",q:"三___笔",a:"支",o:["支","本","杯","个"],e:"✅ 三支笔<br><b>sān zhī bǐ</b><br>Три ручки.<br><br><b>支</b> — для длинных вытянутых предметов."},
{type:"multi",q:"两___牛奶",answers:["瓶","杯"],o:["瓶","杯","本","支"],e:"✅ 两瓶牛奶 — liǎng píng niúnǎi — две бутылки молока.<br>✅ 两杯牛奶 — liǎng bēi niúnǎi — два стакана молока.<br><br><b>瓶</b> — бутылка.<br><b>杯</b> — чашка или стакан."},
{type:"multi",q:"五___水",answers:["瓶","杯"],o:["瓶","杯","本","个"],e:"✅ 五瓶水 — пять бутылок воды.<br>✅ 五杯水 — пять стаканов воды.<br><br><b>瓶</b> — бутылка.<br><b>杯</b> — чашка или стакан."},
{type:"multi",q:"四___啤酒",answers:["瓶","杯"],o:["瓶","杯","本","支"],e:"✅ 四瓶啤酒 — четыре бутылки пива.<br>✅ 四杯啤酒 — четыре кружки/стакана пива.<br><br><b>瓶</b> — бутылка.<br><b>杯</b> — стакан, кружка."},
{type:"single",q:"三___茶",a:"杯",o:["杯","瓶","本","个"],e:"✅ 三杯茶<br><b>sān bēi chá</b><br>Три чашки чая.<br><br><b>杯</b> — чашка или стакан напитка."},
{type:"single",q:"两___咖啡",a:"杯",o:["杯","瓶","支","本"],e:"✅ 两杯咖啡<br><b>liǎng bēi kāfēi</b><br>Две чашки кофе.<br><br><b>杯</b> — чашка напитка."},
{type:"single",q:"三___米饭",a:"碗",o:["碗","杯","瓶","个"],e:"✅ 三碗米饭<br><b>sān wǎn mǐfàn</b><br>Три миски риса.<br><br><b>碗</b> — миска еды."},
{type:"single",q:"两___面条",a:"碗",o:["碗","本","个","支"],e:"✅ 两碗面条<br><b>liǎng wǎn miàntiáo</b><br>Две миски лапши.<br><br><b>碗</b> — миска еды."},
{type:"single",q:"八___书",a:"本",o:["本","个","支","瓶"],e:"✅ 八本书<br><b>bā běn shū</b><br>Восемь книг.<br><br><b>本</b> — предметы с переплётом."}
];

questions.sort(()=>Math.random()-0.5);
let current=0,score=0,selected=[];

function loadQ(){
const q=questions[current];
question.innerHTML=q.q;
counter.innerHTML=(current+1)+"/"+questions.length;
feedback.innerHTML="";
selected=[];
options.innerHTML="";
nextBtn.style.display="none";
checkBtn.style.display="inline-block";
note.innerHTML=q.type==="multi"?"⚠️ <b style=\"font-size:28px\">ДВА</b> правильных ответа":"Выберите один ответ";

q.o.sort(()=>Math.random()-0.5).forEach(v=>{
let b=document.createElement("button");
b.className="option";
b.textContent=v;
b.onclick=()=>{
if(q.type==="single"){
document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
selected=[v];
b.classList.add("selected");
}else{
b.classList.toggle("selected");
if(selected.includes(v)){
selected=selected.filter(x=>x!==v);
}else{
selected.push(v);
}
}
};
options.appendChild(b);
});
bar.style.width=(current/questions.length*100)+"%";
}

checkBtn.onclick=()=>{
const q=questions[current];
let ok=false;

if(q.type==="single"){
ok=selected.length===1 && (Array.isArray(q.a)?q.a.includes(selected[0]):selected[0]===q.a);
}else{
ok=q.answers.every(x=>selected.includes(x)) &&
selected.length===q.answers.length;
}

if(ok){
score++;
feedback.innerHTML=q.e;
feedback.style.color="green";
}else{
feedback.innerHTML="❌ Неверно.<br><br>"+q.e;
feedback.style.color="red";
}

document.querySelectorAll(".option").forEach(x=>x.disabled=true);
checkBtn.style.display="none";
nextBtn.style.display="inline-block";
};

nextBtn.onclick=()=>{
current++;
if(current>=questions.length){
document.querySelector(".card").innerHTML=`<h1>🎉 Готово!</h1><h2>${score} / ${questions.length}</h2><button onclick="location.reload()">Начать заново</button>`;
return;
}
loadQ();
};

loadQ();
</script>
</body>
</html>
