<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Счётные слова</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
text-align:center;
}

h1{
margin-top:0;
}

.progress{
height:16px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress-bar{
height:100%;
width:0%;
background:#4caf50;
transition:.3s;
}

.question{
font-size:48px;
margin:30px 0;
font-weight:bold;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.option{
padding:18px;
font-size:32px;
border:none;
border-radius:12px;
cursor:pointer;
background:#eef2ff;
}

.option:hover{
transform:scale(1.03);
}

.feedback{
margin-top:25px;
font-size:24px;
min-height:120px;
}

.next{
display:none;
margin-top:20px;
padding:12px 24px;
font-size:20px;
cursor:pointer;
}

.score{
font-size:28px;
font-weight:bold;
}

@media(max-width:768px){
.question{font-size:34px}
.option{font-size:24px}
}
</style>
</head>
<body>

<div class="container">
<div class="card">

<h1>量词练习<br>Счётные слова</h1>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div id="counter"></div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="feedback" id="feedback"></div>

<button class="next" id="nextBtn">下一题 →</button>

</div>
</div>

<script>

const questions=[
{q:"一本___",a:"书",o:["书","面包","牛奶","咖啡"],e:"✅ 一本书<br><b>本</b> — счётное слово для книг."},
{q:"一本___",a:"词典",o:["词典","啤酒","包子","茶"],e:"✅ 一本词典<br><b>本</b> — для словарей."},
{q:"一本___",a:"本子",o:["本子","面条","水","咖啡"],e:"✅ 一本本子<br><b>本</b> — для тетрадей."},
{q:"一个___",a:"面包",o:["面包","牛奶","词典","茶"],e:"✅ 一个面包<br><b>个</b> подходит для хлеба."},
{q:"一个___",a:"包子",o:["包子","书","啤酒","咖啡"],e:"✅ 一个包子<br><b>个</b> подходит для баодзы."},
{q:"一个___",a:"饺子",o:["饺子","牛奶","词典","茶"],e:"✅ 一个饺子<br><b>个</b> подходит для пельменей."},
{q:"一个___",a:"书包",o:["书包","啤酒","茶","面条"],e:"✅ 一个书包<br><b>个</b> подходит для рюкзаков."},
{q:"一支___",a:"笔",o:["笔","书","水","包子"],e:"✅ 一支笔<br><b>支</b> — счётное слово для ручек."},
{q:"一瓶___",a:"牛奶",o:["牛奶","书","包子","词典"],e:"✅ 一瓶牛奶<br><b>瓶</b> — бутылка."},
{q:"一瓶___",a:"水",o:["水","面包","词典","本子"],e:"✅ 一瓶水<br><b>瓶</b> — бутылка."},
{q:"一瓶___",a:"啤酒",o:["啤酒","书包","包子","词典"],e:"✅ 一瓶啤酒<br><b>瓶</b> — бутылка."},
{q:"一杯___",a:"茶",o:["茶","书","面包","书包"],e:"✅ 一杯茶<br><b>杯</b> — чашка или стакан."},
{q:"一杯___",a:"咖啡",o:["咖啡","本子","书","包子"],e:"✅ 一杯咖啡<br><b>杯</b> — чашка кофе."},
{q:"一碗___",a:"米饭",o:["米饭","茶","啤酒","书"],e:"✅ 一碗米饭<br><b>碗</b> — миска."},
{q:"一碗___",a:"面条",o:["面条","牛奶","咖啡","本子"],e:"✅ 一碗面条<br><b>碗</b> — миска."},
{q:"两瓶___",a:"牛奶",o:["牛奶","书","面包","词典"],e:"✅ 两瓶牛奶 = две бутылки молока."},
{q:"三本___",a:"书",o:["书","咖啡","包子","茶"],e:"✅ 三本书 = три книги."},
{q:"四个___",a:"包子",o:["包子","书","啤酒","牛奶"],e:"✅ 四个包子 = четыре баодзы."},
{q:"五支___",a:"笔",o:["笔","书","茶","咖啡"],e:"✅ 五支笔 = пять ручек."},
{q:"六杯___",a:"咖啡",o:["咖啡","书","词典","书包"],e:"✅ 六杯咖啡 = шесть чашек кофе."}
];

let current=0;
let score=0;

function loadQuestion(){
const q=questions[current];
document.getElementById("question").innerHTML=q.q;
document.getElementById("counter").innerHTML=`${current+1}/${questions.length}`;
document.getElementById("feedback").innerHTML="";
document.getElementById("nextBtn").style.display="none";

const options=document.getElementById("options");
options.innerHTML="";

q.o.sort(()=>Math.random()-0.5).forEach(item=>{
const btn=document.createElement("button");
btn.className="option";
btn.innerHTML=item;
btn.onclick=()=>check(item);
options.appendChild(btn);
});

document.getElementById("bar").style.width=((current)/questions.length*100)+"%";
}

function check(choice){
const q=questions[current];
const fb=document.getElementById("feedback");

if(choice===q.a){
score++;
fb.innerHTML=q.e;
fb.style.color="green";
}else{
fb.innerHTML=`❌ Неверно.<br>Правильный ответ: <b>${q.a}</b><br><br>${q.e}`;
fb.style.color="red";
}

document.querySelectorAll(".option").forEach(b=>b.disabled=true);
document.getElementById("nextBtn").style.display="inline-block";
}

document.getElementById("nextBtn").onclick=()=>{
current++;
if(current>=questions.length){
document.querySelector(".card").innerHTML=`
<h1>🎉 Готово!</h1>
<p class="score">Результат: ${score} / ${questions.length}</p>
<button onclick="location.reload()">Начать заново</button>
`;
return;
}
loadQuestion();
};

loadQuestion();

</script>
</body>
</html>
