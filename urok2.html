<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Урок 2 — Семья + Состояния</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a2a3a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #f5f7fb;
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: #2c5f8a;
            color: white;
            padding: 24px 28px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.85;
        }

        .level-badge {
            display: inline-block;
            background: #f5a623;
            color: #1e2a3e;
            padding: 6px 18px;
            border-radius: 60px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: #e9ecef;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-box {
            background: #2c5f8a;
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
        }

        .message-area {
            background: #fff3cd;
            margin: 16px 28px 0 28px;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            font-weight: 500;
            transition: 0.2s;
        }

        /* Pаздел для пазла (уровень 1) */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            padding: 28px;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 16px 20px;
            min-width: 100px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border: 2px solid #dce5ec;
        }

        .card.type-hanzi {
            background: #fff0e6;
            border-color: #c44536;
            color: #c44536;
            font-size: 1.8rem;
            min-width: 110px;
        }

        .card.type-pinyin {
            background: #e6f4f1;
            border-color: #2c6e6e;
            color: #2c6e6e;
            font-family: monospace;
            font-size: 1.1rem;
        }

        .card.type-translation {
            background: #e8f0fe;
            border-color: #2c5f8a;
            color: #1e4663;
            font-size: 1rem;
        }

        .card.selected {
            background: #ffecb3;
            border-color: #f5a623;
            transform: scale(0.98);
        }

        .card.matched {
            display: none;
        }

        /* Сопоставление (уровень 2) */
        .matching-board {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 28px;
            justify-content: center;
        }

        .matching-column {
            flex: 1;
            min-width: 260px;
            background: #f8fafc;
            border-radius: 32px;
            padding: 20px;
        }

        .matching-column h3 {
            text-align: center;
            color: #1e4663;
            margin-bottom: 20px;
        }

        .matching-card {
            background: white;
            border: 2px solid #dce5ec;
            border-radius: 60px;
            padding: 14px 20px;
            margin-bottom: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .matching-card.chinese-card {
            color: #c44536;
            font-size: 1.3rem;
        }

        .matching-card.russian-card {
            color: #2c5f8a;
        }

        .matching-card.selected {
            background: #ffecb3;
            border-color: #f5a623;
        }

        .matching-card.matched {
            display: none;
        }

        .next-btn, .reset-all-btn {
            background: #2c5f8a;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin: 20px 28px;
            display: block;
            width: calc(100% - 56px);
        }

        .next-btn {
            background: #2c6e6e;
        }

        .next-btn:hover, .reset-all-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 18px 20px;
            color: #6c7a89;
            font-size: 0.75rem;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 700px) {
            .card { padding: 12px 14px; min-width: 75px; }
            .card.type-hanzi { font-size: 1.5rem; min-width: 85px; }
            .matching-card { padding: 10px 16px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1>📚 Урок 2</h1>
        <p id="levelTitle">👨‍👩‍👧‍👦 Семья и местоимения</p>
        <div class="level-badge" id="levelBadge">Уровень 1 / 2</div>
    </div>

    <div class="stats">
        <div class="score-box" id="statsLeft">✅ Собрано: <span id="progressCount">0</span> / <span id="totalCount">0</span></div>
        <div class="score-box" id="statsRight">🎯 Осталось: <span id="remainingCount">0</span></div>
    </div>

    <div id="messageArea" class="message-area">🔍 Начинаем уровень 1: собери пазл</div>

    <div id="gameContent"></div>

    <button id="nextLevelBtn" class="next-btn hidden">➡ Перейти к уровню 2</button>
    <button id="resetAllBtn" class="reset-all-btn">🔄 Начать урок заново</button>
    <footer>Сначала собери все слова по теме "Семья", затем перейди к состояниям</footer>
</div>

<script>
    // ---------- УРОВЕНЬ 1: Семья и местоимения (11 слов) ----------
    const level1Words = [
        { hanzi: "我", pinyin: "wǒ", translation: "я" },
        { hanzi: "爸爸", pinyin: "bàba", translation: "папа" },
        { hanzi: "妈妈", pinyin: "māma", translation: "мама" },
        { hanzi: "他们", pinyin: "tāmen", translation: "они" },
        { hanzi: "哥哥", pinyin: "gēge", translation: "старший брат" },
        { hanzi: "他", pinyin: "tā", translation: "он" },
        { hanzi: "姐姐", pinyin: "jiějie", translation: "старшая сестра" },
        { hanzi: "她", pinyin: "tā", translation: "она" },
        { hanzi: "爱人", pinyin: "àiren", translation: "супруг; супруга" },
        { hanzi: "弟弟", pinyin: "dìdi", translation: "младший брат" },
        { hanzi: "妹妹", pinyin: "mèimei", translation: "младшая сестра" }
    ];

    // ---------- УРОВЕНЬ 2: Состояния, частицы, наречия (9 слов) ----------
    const level2Words = [
        { hanzi: "吗", pinyin: "ma", translation: "вопросительная частица" },
        { hanzi: "很", pinyin: "hěn", translation: "очень" },
        { hanzi: "呢", pinyin: "ne", translation: "частица переспроса" },
        { hanzi: "也", pinyin: "yě", translation: "тоже" },
        { hanzi: "都", pinyin: "dōu", translation: "все; оба" },
        { hanzi: "忙", pinyin: "máng", translation: "занятый" },
        { hanzi: "累", pinyin: "lèi", translation: "уставший" },
        { hanzi: "饿", pinyin: "è", translation: "голодный" },
        { hanzi: "渴", pinyin: "kě", translation: "испытывающий жажду" }
    ];

    let currentLevel = 1;
    let level1Complete = false;
    let level2Complete = false;

    // Переменные для уровня 1 (пазл)
    let cards = [];
    let selectedCards = [];
    let currentStep = 0;
    let matchedWords1 = new Array(level1Words.length).fill(false);

    // Переменные для уровня 2 (сопоставление)
    let leftItems = [];
    let rightItems = [];
    let selectedLeftId = null;
    let matchedWords2 = new Array(level2Words.length).fill(false);

    // DOM элементы
    const gameContent = document.getElementById('gameContent');
    const levelTitle = document.getElementById('levelTitle');
    const levelBadge = document.getElementById('levelBadge');
    const messageDiv = document.getElementById('messageArea');
    const progressSpan = document.getElementById('progressCount');
    const totalSpan = document.getElementById('totalCount');
    const remainingSpan = document.getElementById('remainingCount');
    const nextLevelBtn = document.getElementById('nextLevelBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    // ========== УРОВЕНЬ 1: ПАЗЛ ==========
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildDeckLevel1() {
        const deck = [];
        level1Words.forEach((word, idx) => {
            deck.push({ id: Math.random(), wordId: idx, type: 'hanzi', value: word.hanzi, matched: false });
            deck.push({ id: Math.random(), wordId: idx, type: 'pinyin', value: word.pinyin, matched: false });
            deck.push({ id: Math.random(), wordId: idx, type: 'translation', value: word.translation, matched: false });
        });
        return shuffleArray(deck);
    }

    function updateStatsLevel1() {
        const matchedCount = matchedWords1.filter(m => m === true).length;
        progressSpan.textContent = matchedCount;
        totalSpan.textContent = level1Words.length;
        remainingSpan.textContent = level1Words.length - matchedCount;
        if (matchedCount === level1Words.length && !level1Complete) {
            level1Complete = true;
            messageDiv.innerHTML = "🎉 Уровень 1 пройден! Нажмите «Перейти к уровню 2» 🎉";
            messageDiv.style.background = "#c8e6d9";
            nextLevelBtn.classList.remove('hidden');
        }
    }

    function setMessageLevel1(msg, isError = false) {
        messageDiv.innerHTML = msg;
        if (isError) {
            messageDiv.style.background = "#ffe0db";
            messageDiv.style.color = "#9b2c1c";
            setTimeout(() => {
                if (!level1Complete && matchedWords1.filter(m => !m).length > 0) {
                    messageDiv.style.background = "#fff3cd";
                    messageDiv.style.color = "#856404";
                    messageDiv.innerHTML = "🃏 Выбери иероглиф → пиньинь → перевод";
                }
            }, 1500);
        } else {
            messageDiv.style.background = "#fff3cd";
            messageDiv.style.color = "#856404";
        }
    }

    function resetSelectionLevel1() {
        selectedCards = [];
        currentStep = 0;
        renderLevel1();
    }

    function tryMatch(c1, c2, c3) {
        if (c1.wordId !== c2.wordId || c1.wordId !== c3.wordId) return false;
        return (c1.type === 'hanzi' && c2.type === 'pinyin' && c3.type === 'translation');
    }

    function onCardClick(card) {
        if (card.matched) return;
        if (matchedWords1.every(v => v === true)) return;

        if (currentStep === 0) {
            if (card.type !== 'hanzi') { setMessageLevel1("❌ Сначала выбери ИЕРОГЛИФ", true); return; }
            resetSelectionLevel1();
            selectedCards = [card];
            currentStep = 1;
            setMessageLevel1(`✅ Иероглиф: ${card.value}. Теперь выбери ПИНЬИНЬ.`);
            renderLevel1(card.id);
        }
        else if (currentStep === 1) {
            if (card.type !== 'pinyin') { setMessageLevel1(`❌ Нужен ПИНЬИНЬ для "${selectedCards[0].value}"`, true); resetSelectionLevel1(); return; }
            if (card.wordId !== selectedCards[0].wordId) { setMessageLevel1(`❌ Неправильный пиньинь`, true); resetSelectionLevel1(); return; }
            selectedCards.push(card);
            currentStep = 2;
            setMessageLevel1(`✅ Пиньинь: ${card.value}. Теперь выбери ПЕРЕВОД.`);
            renderLevel1(selectedCards[0]?.id, selectedCards[1]?.id);
        }
        else if (currentStep === 2) {
            if (card.type !== 'translation') { setMessageLevel1(`❌ Нужен ПЕРЕВОД`, true); resetSelectionLevel1(); return; }
            if (card.wordId !== selectedCards[0].wordId) { setMessageLevel1(`❌ Неправильный перевод`, true); resetSelectionLevel1(); return; }
            selectedCards.push(card);
            if (tryMatch(selectedCards[0], selectedCards[1], selectedCards[2])) {
                const wid = selectedCards[0].wordId;
                if (!matchedWords1[wid]) {
                    matchedWords1[wid] = true;
                    cards.forEach(c => { if (c.wordId === wid) c.matched = true; });
                    updateStatsLevel1();
                    setMessageLevel1(`🎉 Слово собрано! Осталось ${level1Words.length - matchedWords1.filter(m=>m).length} слов.`);
                    resetSelectionLevel1();
                } else {
                    setMessageLevel1(`⚠️ Уже собрано`, true);
                    resetSelectionLevel1();
                }
            } else {
                setMessageLevel1(`❌ Ошибка! Начни заново.`, true);
                resetSelectionLevel1();
            }
        }
    }

    function renderLevel1(selectedId1 = null, selectedId2 = null) {
        gameContent.innerHTML = `<div class="cards-grid" id="cardsGrid"></div>`;
        const grid = document.getElementById('cardsGrid');
        cards.forEach(card => {
            if (card.matched) return;
            const div = document.createElement('div');
            div.className = `card type-${card.type}`;
            if ((selectedId1 && card.id === selectedId1) || (selectedId2 && card.id === selectedId2)) div.classList.add('selected');
            div.textContent = card.value;
            div.addEventListener('click', () => onCardClick(card));
            grid.appendChild(div);
        });
    }

    function initLevel1() {
        cards = buildDeckLevel1();
        selectedCards = [];
        currentStep = 0;
        matchedWords1.fill(false);
        level1Complete = false;
        nextLevelBtn.classList.add('hidden');
        updateStatsLevel1();
        setMessageLevel1("🔍 Уровень 1: выбери иероглиф → пиньинь → перевод");
        renderLevel1();
    }

    // ========== УРОВЕНЬ 2: СОПОСТАВЛЕНИЕ ==========
    function initLevel2() {
        leftItems = level2Words.map((word, idx) => ({ id: idx, hanzi: word.hanzi, matched: false }));
        leftItems = shuffleArray([...leftItems]);
        rightItems = level2Words.map((word, idx) => ({ id: idx, translation: word.translation, matched: false }));
        rightItems = shuffleArray([...rightItems]);
        matchedWords2.fill(false);
        selectedLeftId = null;
        level2Complete = false;
        updateStatsLevel2();
        setMessageLevel2("🔍 Выбери иероглиф, затем перевод");
        renderLevel2();
    }

    function updateStatsLevel2() {
        const matchedCount = matchedWords2.filter(m => m === true).length;
        progressSpan.textContent = matchedCount;
        totalSpan.textContent = level2Words.length;
        remainingSpan.textContent = level2Words.length - matchedCount;
        if (matchedCount === level2Words.length && !level2Complete) {
            level2Complete = true;
            messageDiv.innerHTML = "🎉 ПОЗДРАВЛЯЮ! Ты прошёл оба уровня урока 2! 🎉";
            messageDiv.style.background = "#c8e6d9";
            nextLevelBtn.classList.add('hidden');
        }
    }

    function setMessageLevel2(msg, isError = false) {
        messageDiv.innerHTML = msg;
        if (isError) {
            messageDiv.style.background = "#ffe0db";
            messageDiv.style.color = "#9b2c1c";
            setTimeout(() => {
                if (!level2Complete && matchedWords2.filter(m => !m).length > 0) {
                    messageDiv.style.background = "#fff3cd";
                    messageDiv.style.color = "#856404";
                    messageDiv.innerHTML = "🔍 Выбери иероглиф, затем перевод";
                }
            }, 1200);
        } else {
            messageDiv.style.background = "#fff3cd";
            messageDiv.style.color = "#856404";
        }
    }

    function onLeftClick(item) {
        if (item.matched) return;
        if (selectedLeftId === item.id) {
            selectedLeftId = null;
            setMessageLevel2("Выбор сброшен");
            renderLevel2();
            return;
        }
        selectedLeftId = item.id;
        setMessageLevel2(`✅ Выбрано: ${item.hanzi}. Теперь выбери перевод.`);
        renderLevel2();
    }

    function onRightClick(rightItem) {
        if (rightItem.matched) return;
        if (selectedLeftId === null) {
            setMessageLevel2("⚠️ Сначала выбери иероглиф", true);
            return;
        }
        const leftItem = leftItems.find(l => l.id === selectedLeftId);
        if (!leftItem || leftItem.matched) {
            setMessageLevel2("Ошибка, выбери заново", true);
            selectedLeftId = null;
            renderLevel2();
            return;
        }
        const wordId = leftItem.id;
        const correctTranslation = level2Words[wordId].translation;
        if (rightItem.translation === correctTranslation) {
            if (!matchedWords2[wordId]) {
                matchedWords2[wordId] = true;
                leftItem.matched = true;
                rightItem.matched = true;
                updateStatsLevel2();
                setMessageLevel2(`🎉 Правильно! ${leftItem.hanzi} → ${correctTranslation}`);
                selectedLeftId = null;
                renderLevel2();
            } else {
                setMessageLevel2(`⚠️ Это слово уже сопоставлено`, true);
                selectedLeftId = null;
                renderLevel2();
            }
        } else {
            setMessageLevel2(`❌ Неверно. ${leftItem.hanzi} — это «${correctTranslation}». Попробуй ещё.`, true);
            selectedLeftId = null;
            renderLevel2();
        }
    }

    function renderLevel2() {
        gameContent.innerHTML = `
            <div class="matching-board">
                <div class="matching-column">
                    <h3>📖 Китайский</h3>
                    <div id="leftColumn"></div>
                </div>
                <div class="matching-column">
                    <h3>🇷🇺 Перевод</h3>
                    <div id="rightColumn"></div>
                </div>
            </div>
        `;
        const leftContainer = document.getElementById('leftColumn');
        const rightContainer = document.getElementById('rightColumn');

        leftItems.forEach(item => {
            const div = document.createElement('div');
            div.className = `matching-card chinese-card ${item.matched ? 'matched' : ''} ${selectedLeftId === item.id ? 'selected' : ''}`;
            div.textContent = item.hanzi;
            if (!item.matched) div.addEventListener('click', () => onLeftClick(item));
            leftContainer.appendChild(div);
        });

        rightItems.forEach(item => {
            const div = document.createElement('div');
            div.className = `matching-card russian-card ${item.matched ? 'matched' : ''}`;
            div.textContent = item.translation;
            if (!item.matched) div.addEventListener('click', () => onRightClick(item));
            rightContainer.appendChild(div);
        });
    }

    // ========== ПЕРЕКЛЮЧЕНИЕ УРОВНЕЙ ==========
    function switchToLevel2() {
        if (!level1Complete) {
            messageDiv.innerHTML = "⚠️ Сначала заверши уровень 1!";
            return;
        }
        currentLevel = 2;
        levelTitle.innerHTML = "😊 Состояния, частицы, наречия";
        levelBadge.innerHTML = "Уровень 2 / 2";
        nextLevelBtn.classList.add('hidden');
        initLevel2();
    }

    function resetWholeGame() {
        currentLevel = 1;
        level1Complete = false;
        level2Complete = false;
        levelTitle.innerHTML = "👨‍👩‍👧‍👦 Семья и местоимения";
        levelBadge.innerHTML = "Уровень 1 / 2";
        nextLevelBtn.classList.add('hidden');
        initLevel1();
    }

    nextLevelBtn.addEventListener('click', switchToLevel2);
    resetAllBtn.addEventListener('click', resetWholeGame);

    // СТАРТ
    initLevel1();
</script>
</body>
</html>
