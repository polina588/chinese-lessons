<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园地图练习</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <section class="panel">
        <p class="eyebrow">Интерактивное упражнение</p>
        <h1>Где находится…?</h1>

        <div class="question-card">
          <div>
            <p class="label">Вопрос</p>
            <p id="question" class="question">准备开始</p>
            <p id="vocabHint" class="vocab-hint"></p>
          </div>
        </div>

        <p id="feedback" class="feedback neutral">Нажмите на нужное место на карте.</p>

        <button id="nextButton" class="next hidden" type="button">Дальше</button>

        <div class="score-row">
          <span>Правильно: <strong id="correctCount">0</strong></span>
          <span>Ошибки: <strong id="wrongCount">0</strong></span>
        </div>

        <button id="restartButton" class="restart hidden" type="button">Пройти еще раз</button>
      </section>

      <section class="map-wrap" aria-label="校园地图">
        <picture>
          <source srcset="campusmapphone.png" media="(max-width: 700px)" />
          <img id="campusMap" src="campusmappc.png" alt="校园地图" />
        </picture>

        <div id="hotspots" class="hotspots"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
